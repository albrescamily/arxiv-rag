[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Camily Albres", email = "95884575+albrescamily@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "pgvector>=0.5.0",
    "prefect>=3.8.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.0",
]

[project.scripts]
arxiv-rag = "arxiv_rag:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
